<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaouen Hérault</title>
<script defer src="https://cloud.umami.is/script.js" data-website-id="c7647a94-d341-4b45-a3fe-d6fda2beb1f7"></script>

<style>

*{box-sizing:border-box;}

body{
    margin:0;
    background:#1e1e1e;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    color:#eee;
}

#hero{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

#tiles{
    position:relative;
    display:flex;
    width:100%;
    gap:0;
}

@media (max-width:620px){
    #tiles{
        flex-direction:column;
    }
}

.tile{
    flex:1 1 0;
    position:relative;
    min-height:220px;
    border-radius:22px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:left;
    text-decoration:none;
    color:#fff;
    overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease;
    cursor:pointer;
}
.tile:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px rgba(0,0,0,.35);
}
.tile + .tile{
    margin-left:14px;
}
@media (max-width:620px){
    .tile + .tile{
        margin-left:0;
        margin-top:14px;
    }
}

.tile-magazine{
    background:linear-gradient(135deg,#2f6f8f,#163a4d);
}
.tile-campaign{
    background:linear-gradient(135deg,#d97b3f,#7a3e1d);
}

.tile-icon{
    font-size:34px;
    margin-bottom:12px;
}
.tile-label{
    font-size:19px;
    font-weight:bold;
}
.tile-sub{
    margin-top:6px;
    font-size:13px;
    opacity:.85;
    line-height:1.4;
}

.tile-badge{
    position:absolute;
    top:16px;
    right:16px;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    padding:4px 10px;
    border-radius:20px;
    backdrop-filter:blur(4px);
}

#connector{
    position:absolute;
    top:50%;
    left:50%;
    width:56px;
    height:56px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(90deg,#2f6f8f 50%,#d97b3f 50%);
    border:4px solid #1e1e1e;
    z-index:2;
}
@media (max-width:620px){
    #connector{
        background:linear-gradient(180deg,#2f6f8f 50%,#d97b3f 50%);
    }
}

h1{
    margin:36px 0 6px;
    font-size:28px;
    letter-spacing:.02em;
}
#tagline{
    margin:0;
    max-width:460px;
    font-size:15px;
    line-height:1.6;
    color:#c9c9c9;
}

#footerBar{
    margin-top:26px;
    display:flex;
    align-items:center;
    gap:10px;
}
#footerBar a{
    color:#eee;
    text-decoration:none;
    padding:9px 20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .15s ease, border-color .15s ease;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
}
#footerBar a:hover{
    color:#fff;
    background:rgba(255,255,255,.18);
    border-color:rgba(255,255,255,.6);
}
#contactLink{
    background:#5a4fcf;
    border-color:#5a4fcf;
}
#contactLink:hover{
    background:#6e63e0;
    border-color:#6e63e0;
}
.icon-btn{
    width:40px;
    height:40px;
    padding:0;
    justify-content:center;
    border-radius:50%;
}

#copyToast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(10px);
    background:#1e1e1e;
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    padding:10px 18px;
    border-radius:20px;
    font-family:Arial,sans-serif;
    font-size:13px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:3000;
}
#copyToast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div id="hero">

    <div id="tiles">
        <a class="tile tile-magazine" href="magazine.html">
            <div class="tile-icon">📖</div>
            <div class="tile-label">CV Magazine</div>
            <div class="tile-sub">Mon CV à feuilleter, en version magazine</div>
        </a>
        <div id="connector"></div>
        <a class="tile tile-campaign" href="recrutement.html">
            <div class="tile-badge">Bientôt</div>
            <div class="tile-icon">📣</div>
            <div class="tile-label">Campagne de recrutement</div>
            <div class="tile-sub">Campagne de communication recrutement</div>
        </a>
    </div>

    <h1>Jaouen Hérault</h1>
    <p id="tagline">Bienvenue — choisissez une rubrique ci-dessus, ou contactez-moi directement.</p>

    <div id="footerBar">
        <a id="contactLink" href="mailto:jaouenherault@gmail.com">✉️ Me contacter</a>
        <a class="icon-btn" href="https://www.linkedin.com/in/jaouen-h%C3%A9rault/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
    </div>

</div>

<div id="copyToast">Adresse copiée : jaouenherault@gmail.com</div>

<script>
const contactLink = document.getElementById("contactLink");
const copyToast = document.getElementById("copyToast");
let toastTimer;
contactLink.addEventListener("click", () => {
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText("jaouenherault@gmail.com").catch(() => {});
    }
    copyToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => copyToast.classList.remove("show"), 2500);
});
</script>

</body>
</html>
