body{

    background:#fff;

#introModalClose{

    font-size:13px;

}

}

#controls{

    gap:16px;
    margin-top:16px;

    z-index:10;
}
.ctrl-btn{
    background:#2a2a2a;
    border:1px solid #444;
    color:#eee;

    height:40px;
    border-radius:50%;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s;
}
.ctrl-btn:hover{
    background:#3a3a3a;
}
.ctrl-btn:disabled{
    opacity:.35;
    cursor:default;
}
#pageIndicator{
    min-width:90px;
    text-align:center;
    font-size:14px;
    user-select:none;
}
#zoomBtn{
    width:auto;
    padding:0 16px;
    border-radius:20px;
    font-size:14px;
    gap:6px;
}

#footerBar{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:Arial,sans-serif;
    font-size:13px;
    position:relative;
    z-index:10;
}
#footerBar a{
    color:#eee;
    text-decoration:none;
    padding:7px 16px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .15s ease, border-color .15s ease;
}
#footerBar a:hover{
    color:#fff;
    background:rgba(255,255,255,.18);
    border-color:rgba(255,255,255,.6);
}

#copyToast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(10px);
    background:#1e1e1e;
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    padding:10px 18px;
    border-radius:20px;
    font-family:Arial,sans-serif;
    font-size:13px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:3000;
}
#copyToast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

#lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:1000;
    align-items:center;
    justify-content:center;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}
#lightbox.open{
    display:flex;
}
#lightboxImages{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    max-width:95vw;
    max-height:95vh;
}
#lightboxImages img{
    max-width:95vw;
    max-height:95vh;
    min-width:0;
    flex:1 1 0;
    object-fit:contain;
    transform-origin:center center;
    transition:transform .2s ease;
    cursor:zoom-in;
    touch-action:none;
    user-select:none;
    -webkit-user-drag:none;
}
#lightboxImages img.zoomed{
    cursor:grab;
    position:relative;
    z-index:1;
}
#lightboxImages img.dragging{
    cursor:grabbing;
    transition:none;
}
#lightboxClose{
    position:fixed;
    top:16px;
    right:20px;
    color:#fff;
    font-size:34px;
    cursor:pointer;
    z-index:1001;
    line-height:1;
    font-family:Arial,sans-serif;
}

<div id="controls">
    <button id="prevBtn" class="ctrl-btn" aria-label="Page précédente">‹</button>

<script src="js/page-flip.browser.js"></script>

<script>

const pageFlip = new St.PageFlip(
    document.getElementById("flipbook"),
    {
        width:500,
        height:700,

        size:"stretch",

        minWidth:280,
        maxWidth:1000,

        minHeight:400,
        maxHeight:1400,

        showCover:true,

        usePortrait:true,

        mobileScrollSupport:true,

        autoSize:true
    }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

const pages = document.querySelectorAll(".page");
const totalPages = pages.length;

const pageIndicator = document.getElementById("pageIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const zoomBtn = document.getElementById("zoomBtn");
const lightbox = document.getElementById("lightbox");
const lightboxImages = document.getElementById("lightboxImages");
const lightboxClose = document.getElementById("lightboxClose");
const introModal = document.getElementById("introModal");
const introModalClose = document.getElementById("introModalClose");
const contactLink = document.getElementById("contactLink");
const copyToast = document.getElementById("copyToast");

function loadPage(index){
    const page = pages[index];
    if(!page) return;
    const img = page.querySelector("img");
    if(img && !img.src && img.dataset.src){
        img.src = img.dataset.src;
    }
}

function loadAround(index){
    for(let i = Math.max(0, index - 1); i <= Math.min(totalPages - 1, index + 3); i++){
        loadPage(i);
    }
}

function updateIndicator(index){
    pageIndicator.textContent = "Page " + (index + 1) + " / " + totalPages;
    prevBtn.disabled = index <= 0;
    nextBtn.disabled = index >= totalPages - 1;
}

const ZOOM_SCALE = 2.2;

function attachZoomPan(img){
    let downX, downY, startTx, startTy, moved, dragging;

    img.addEventListener("pointerdown", (e) => {
        dragging = img.classList.contains("zoomed");
        moved = false;
        downX = e.clientX;
        downY = e.clientY;
        startTx = parseFloat(img.dataset.tx || 0);
        startTy = parseFloat(img.dataset.ty || 0);
        try { img.setPointerCapture(e.pointerId); } catch(err) {}
        if(dragging) img.classList.add("dragging");
    });

    img.addEventListener("pointermove", (e) => {
        if(downX === undefined) return;
        const dx = e.clientX - downX;
        const dy = e.clientY - downY;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        if(dragging && moved){
            const tx = startTx + dx / ZOOM_SCALE;
            const ty = startTy + dy / ZOOM_SCALE;
            img.dataset.tx = tx;
            img.dataset.ty = ty;
            img.style.transform = "scale(" + ZOOM_SCALE + ") translate(" + tx + "px, " + ty + "px)";
        }
    });

    img.addEventListener("pointerup", (e) => {
        if(downX === undefined) return;
        img.classList.remove("dragging");
        if(!moved){
            if(!img.classList.contains("zoomed")){
                const rect = img.getBoundingClientRect();
                const tx = rect.width / 2 - (e.clientX - rect.left);
                const ty = rect.height / 2 - (e.clientY - rect.top);
                img.dataset.tx = tx;
                img.dataset.ty = ty;
                img.style.transform = "scale(" + ZOOM_SCALE + ") translate(" + tx + "px, " + ty + "px)";
                img.classList.add("zoomed");
            } else {
                img.style.transform = "scale(1)";
                img.dataset.tx = 0;
                img.dataset.ty = 0;
                img.classList.remove("zoomed");
            }
        }
        downX = undefined;
    });

    img.addEventListener("pointercancel", () => {
        downX = undefined;
        img.classList.remove("dragging");
    });
}

function openZoom(srcs){
    const list = (Array.isArray(srcs) ? srcs : [srcs]).filter(Boolean);
    if(!list.length) return;
    lightboxImages.innerHTML = "";
    list.forEach((src) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Page agrandie";
        img.draggable = false;
        attachZoomPan(img);
        lightboxImages.appendChild(img);
    });
    lightbox.classList.add("open");
}

function getVisiblePageIndices(){
    const pc = pageFlip.getPageCollection();
    const spreads = pageFlip.getOrientation() === "portrait" ? pc.portraitSpread : pc.landscapeSpread;
    const spread = spreads && spreads[pc.currentSpreadIndex];
    return spread && spread.length ? spread : [pageFlip.getCurrentPageIndex()];
}

function closeLightbox(){
    lightbox.classList.remove("open");
}

loadAround(0);
updateIndicator(0);

const introModalBox = document.getElementById("introModalBox");

introModal.classList.add("open");
setTimeout(() => introModalBox.classList.add("expanded"), 700);

introModalClose.addEventListener("click", () => introModal.classList.remove("open"));

let toastTimer;
contactLink.addEventListener("click", () => {
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText("jaouenherault@gmail.com").catch(() => {});
    }
    copyToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => copyToast.classList.remove("show"), 2500);
});
introModal.addEventListener("click", (e) => {
    if(e.target === introModal) introModal.classList.remove("open");
});

pageFlip.on("flip", (e) => {
    updateIndicator(e.data);
    loadAround(e.data);
});

prevBtn.addEventListener("click", () => pageFlip.flipPrev());
nextBtn.addEventListener("click", () => pageFlip.flipNext());

zoomBtn.addEventListener("click", () => {
    const indices = getVisiblePageIndices();
    indices.forEach(loadPage);
    const srcs = indices.map((i) => {
        const img = pages[i] ? pages[i].querySelector("img") : null;
        return img ? img.src : null;
    });
    openZoom(srcs);
});

window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft") pageFlip.flipPrev();
    if(e.key === "ArrowRight") pageFlip.flipNext();
    if(e.key === "Escape"){
        closeLightbox();
        introModal.classList.remove("open");
    }
});

lightbox.addEventListener("click", (e) => {
    if(e.target === lightbox) closeLightbox();
});
lightboxClose.addEventListener("click", closeLightbox);


</script>

</body>
