<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Magazine - Jaouen Hérault</title>

<style>

body{
    margin:0;
    background:#1e1e1e;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    box-sizing:border-box;
}

#flipbook{
    width:100%;
    max-width:1000px;
    height:700px;
}

.page{
    background:transparent;
}

.page img{
    width:100%;
    height:100%;
    object-fit:contain;
}
#mobileMessage{
    display:none;
    color:white;
    text-align:center;
    margin-bottom:20px;
    font-family:Arial,sans-serif;
}

@media (max-width:768px){

    body{
        flex-direction:column;
    }

    #mobileMessage{
        display:block;
    }

}
</style>
</head>

<body>
<div id="mobileMessage">
📱 Pour une meilleure expérience, ouvrez cette page sur votre ordinateur ou passez votre téléphone en mode paysage.
</div>
<div id="flipbook">

<div class="page"><img src="pages/current/MCV.jpg"></div>
<div class="page"><img src="pages/current/MCV2.jpg"></div>

<div class="page"><img src="pages/current/MCV8.jpg"></div>
<div class="page"><img src="pages/current/MCV9.jpg"></div>
<div class="page"><img src="pages/current/MCV10.jpg"></div>
<div class="page"><img src="pages/current/MCV11.jpg"></div>
<div class="page"><img src="pages/current/MCV12.jpg"></div>

<div class="page"><img src="pages/current/MCV14.jpg"></div>
<div class="page"><img src="pages/current/MCV15.jpg"></div>
<div class="page"><img src="pages/current/MCV16.jpg"></div>
<div class="page"><img src="pages/current/MCV17.jpg"></div>

</div>

<script src="js/page-flip.browser.js"></script>

<script>

const pageFlip = new St.PageFlip(
    document.getElementById("flipbook"),
    {
        width:500,
        height:700,

        size:"stretch",

        minWidth:280,
        maxWidth:1000,

        minHeight:400,
        maxHeight:1400,

        showCover:true,

        usePortrait:true,

        mobileScrollSupport:true,

        autoSize:true
    }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

</script>

</body>
</html>
