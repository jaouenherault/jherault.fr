<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Magazine - Jaouen Hérault</title>

<style>

body{
    margin:0;
    background:#1e1e1e;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    box-sizing:border-box;
}

#flipbook{
    width:100%;
    max-width:1000px;
    height:700px;
}

.page{
    background:transparent;
}

.page img{
    width:100%;
    height:100%;
    object-fit:cover;
}
#introModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:24px;
    box-sizing:border-box;
}
#introModal.open{
    display:flex;
}
#introModalBox{
    background:#fff;
    color:#1e1e1e;
    border-radius:12px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    width:150px;
    padding:26px;
    transform:scale(.92);
    opacity:0;
    transition:
        width .55s cubic-bezier(.4,0,.2,1),
        padding .55s cubic-bezier(.4,0,.2,1),
        transform .4s ease,
        opacity .4s ease;
}
#introModal.open #introModalBox{
    transform:scale(1);
    opacity:1;
}
#introModalBox.expanded{
    width:min(350px, 88vw);
    padding:24px;
}
#introLogo{
    width:74px;
    height:auto;
    flex-shrink:0;
    display:block;
}
#introModalBox.expanded #introLogo{
    margin-right:16px;
}
#introContent{
    width:min(200px, calc(88vw - 138px));
    flex-shrink:0;
    max-height:0;
    opacity:0;
    overflow:hidden;
    text-align:left;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease .15s;
}
#introModalBox.expanded #introContent{
    max-height:220px;
    opacity:1;
}
#introModalClose{
    margin-top:14px;
    background:#1e1e1e;
    color:#fff;
    border:none;
    padding:9px 20px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
}
#introModalClose:hover{
    background:#3a3a3a;
}

#controls{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:16px;
    font-family:Arial,sans-serif;
    color:#eee;
    position:relative;
    z-index:10;
}
.ctrl-btn{
    background:#2a2a2a;
    border:1px solid #444;
    color:#eee;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s;
}
.ctrl-btn:hover{
    background:#3a3a3a;
}
.ctrl-btn:disabled{
    opacity:.35;
    cursor:default;
}
#pageIndicator{
    min-width:90px;
    text-align:center;
    font-size:14px;
    user-select:none;
}
#zoomBtn{
    width:auto;
    padding:0 16px;
    border-radius:20px;
    font-size:14px;
    gap:6px;
}

#footerBar{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:Arial,sans-serif;
    font-size:13px;
    color:#777;
}
#footerBar a{
    color:#999;
    text-decoration:none;
}
#footerBar a:hover{
    color:#fff;
    text-decoration:underline;
}
#footerBar .footer-sep{
    color:#444;
}

#lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:1000;
    align-items:center;
    justify-content:center;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}
#lightbox.open{
    display:flex;
}
#lightbox img{
    max-width:95vw;
    max-height:95vh;
    transition:transform .2s ease;
    cursor:zoom-in;
    touch-action:pinch-zoom;
}
#lightbox img.zoomed{
    cursor:zoom-out;
}
#lightboxClose{
    position:fixed;
    top:16px;
    right:20px;
    color:#fff;
    font-size:34px;
    cursor:pointer;
    z-index:1001;
    line-height:1;
    font-family:Arial,sans-serif;
}
<script defer src="https://cloud.umami.is/script.js" data-website-id="c7647a94-d341-4b45-a3fe-d6fda2beb1f7"></script>

</style>
</head>

<body>
<div id="introModal">
    <div id="introModalBox">
        <img id="introLogo" src="logo-mcv.png" alt="MCV">
        <div id="introContent">
            📱 Pour une meilleure expérience, ouvrez cette page sur votre ordinateur (ou passez votre navigateur en « mode ordinateur » pour profiter des pages en vis-à-vis).
            <br>
            <button id="introModalClose">J'ai compris</button>
        </div>
    </div>

<div id="flipbook">

<div class="page"><img src="pages/current/MCV.jpg"></div>
<div class="page"><img src="pages/current/MCV2.jpg"></div>
<div class="page"><img src="pages/current/MCV3.jpg"></div>
<div class="page"><img src="pages/current/MCV4.jpg"></div>
<div class="page"><img data-src="pages/current/MCV5.jpg"></div>
<div class="page"><img data-src="pages/current/MCV6.jpg"></div>
<div class="page"><img data-src="pages/current/MCV7.jpg"></div>
<div class="page"><img data-src="pages/current/MCV8.jpg"></div>
<div class="page"><img data-src="pages/current/MCV9.jpg"></div>
<div class="page"><img data-src="pages/current/MCV10.jpg"></div>
<div class="page"><img data-src="pages/current/MCV11.jpg"></div>
<div class="page"><img data-src="pages/current/MCV12.jpg"></div>
<div class="page"><img data-src="pages/current/MCV13.jpg"></div>
<div class="page"><img data-src="pages/current/MCV14.jpg"></div>
<div class="page"><img data-src="pages/current/MCV15.jpg"></div>
<div class="page"><img data-src="pages/current/MCV16.jpg"></div>
<div class="page"><img data-src="pages/current/MCV17.jpg"></div>
<div class="page"><img data-src="pages/current/MCV18.jpg"></div>
<div class="page"><img data-src="pages/current/MCV19.jpg"></div>
<div class="page"><img data-src="pages/current/MCV20.jpg"></div>

<div id="controls">
    <button id="prevBtn" class="ctrl-btn" aria-label="Page précédente">‹</button>
    <span id="pageIndicator">Page 1 / 21</span>
    <button id="nextBtn" class="ctrl-btn" aria-label="Page suivante">›</button>
    <button id="zoomBtn" class="ctrl-btn" aria-label="Zoomer la page">🔍</button>

<div id="footerBar">
    <a href="https://www.linkedin.com/in/jaouen-h%C3%A9rault/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <span class="footer-sep">·</span>
    <a href="mailto:jaouenherault@gmail.com">Me contacter</a>
</div>

<div id="lightbox">
    <span id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="Page agrandie">
</div>

<script src="js/page-flip.browser.js"></script>

<script>

const pageFlip = new St.PageFlip(
    document.getElementById("flipbook"),
    {
        width:500,
        height:700,

        size:"stretch",

        minWidth:280,
        maxWidth:1000,

        minHeight:400,
        maxHeight:1400,

        showCover:true,

        usePortrait:true,

        mobileScrollSupport:true,

        autoSize:true
    }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

const pages = document.querySelectorAll(".page");
const totalPages = pages.length;

const pageIndicator = document.getElementById("pageIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const zoomBtn = document.getElementById("zoomBtn");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxClose = document.getElementById("lightboxClose");
const introModal = document.getElementById("introModal");
const introModalClose = document.getElementById("introModalClose");

function loadPage(index){
    const page = pages[index];
    if(!page) return;
    const img = page.querySelector("img");
    if(img && !img.src && img.dataset.src){
        img.src = img.dataset.src;
    }
}

function loadAround(index){
    for(let i = Math.max(0, index - 1); i <= Math.min(totalPages - 1, index + 3); i++){
        loadPage(i);
    }
}

function updateIndicator(index){
    pageIndicator.textContent = "Page " + (index + 1) + " / " + totalPages;
    prevBtn.disabled = index <= 0;
    nextBtn.disabled = index >= totalPages - 1;
}

function openZoom(src){
    if(!src) return;
    lightboxImg.src = src;
    lightboxImg.classList.remove("zoomed");
    lightboxImg.style.transform = "scale(1)";
    lightbox.classList.add("open");
}

function closeLightbox(){
    lightbox.classList.remove("open");
}

loadAround(0);
updateIndicator(0);

const introModalBox = document.getElementById("introModalBox");

introModal.classList.add("open");
setTimeout(() => introModalBox.classList.add("expanded"), 700);

introModalClose.addEventListener("click", () => introModal.classList.remove("open"));
introModal.addEventListener("click", (e) => {
    if(e.target === introModal) introModal.classList.remove("open");
});

pageFlip.on("flip", (e) => {
    updateIndicator(e.data);
    loadAround(e.data);
});

prevBtn.addEventListener("click", () => pageFlip.flipPrev());
nextBtn.addEventListener("click", () => pageFlip.flipNext());

zoomBtn.addEventListener("click", () => {
    const idx = pageFlip.getCurrentPageIndex();
    loadPage(idx);
    const img = pages[idx] ? pages[idx].querySelector("img") : null;
    openZoom(img ? img.src : null);
});

window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft") pageFlip.flipPrev();
    if(e.key === "ArrowRight") pageFlip.flipNext();
    if(e.key === "Escape"){
        closeLightbox();
        introModal.classList.remove("open");
    }
});

lightbox.addEventListener("click", (e) => {
    if(e.target === lightbox) closeLightbox();
});
lightboxClose.addEventListener("click", closeLightbox);

lightboxImg.addEventListener("click", (e) => {
    if(!lightboxImg.classList.contains("zoomed")){
        const rect = lightboxImg.getBoundingClientRect();
        const originX = ((e.clientX - rect.left) / rect.width) * 100;
        const originY = ((e.clientY - rect.top) / rect.height) * 100;
        lightboxImg.style.transformOrigin = originX + "% " + originY + "%";
        lightboxImg.style.transform = "scale(2.2)";
        lightboxImg.classList.add("zoomed");
    } else {
        lightboxImg.style.transform = "scale(1)";
        lightboxImg.classList.remove("zoomed");
    }
});

</script>

</body>
</html>
